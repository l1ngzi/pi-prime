name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src/terminal/native/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src/terminal/native/Cargo.toml

      - name: Install Node devDependencies
        env:
          PI_PRIME_SKIP_NATIVE_INSTALL: "1"
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run check

      - name: Build native helper and run test suite
        run: npm test
